<h1>${esc(t(page.title))}</h1>
${each(groupBy(data.teaching, (x) => x.kind), ([kind, items]) => `<section class="section" aria-labelledby="h-${kind}">
  <h2 id="h-${kind}">${esc(ui.teaching_kinds[kind])}</h2>
  <ul class="list">
    ${each(items, (x) => `<li id="${esc(x.id)}">
      <p class="item-title">${txt(x.title)}</p>
      <p class="meta">${txt(x.institution)} · ${txt(x.years)}${x.level ? ' · ' + txt(x.level) : ''}</p>
    </li>`)}
  </ul>
</section>`)}
