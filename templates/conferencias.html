<h1>${esc(t(page.title))}</h1>
${each(groupBy(data.talks, (x) => x.year), ([year, items]) => `<section class="section" aria-labelledby="h-t${year}">
  <h2 id="h-t${year}">${year}</h2>
  <ul class="list">
    ${each(items, (x) => `<li id="${esc(x.id)}">
      <p class="item-title">${link(x.url, x.title)}</p>
      <p class="meta">${txt(x.role)} · ${txt(x.institution)} · ${txt(x.city)}, ${txt(x.country)}</p>
    </li>`)}
  </ul>
</section>`)}
